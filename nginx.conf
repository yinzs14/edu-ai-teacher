# Edu AI Teacher Nginx 配置
# 将此文件放到 /etc/nginx/sites-available/edu-ai-teacher
# 然后执行: sudo ln -s /etc/nginx/sites-available/edu-ai-teacher /etc/nginx/sites-enabled/
# 测试: sudo nginx -t
# 重载: sudo nginx -s reload

server {
    listen 80;
    server_name _;   # 替换为你的域名，或保留 _ 用 IP 访问

    # 前端静态文件
    root /home/ubuntu/edu-ai-teacher/dist;
    index index.html;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
